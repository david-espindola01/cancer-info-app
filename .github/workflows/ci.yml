name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (lint, tipos, código muerto, duplicados, capas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run duplicados
      - run: npm run dependencias
      # Solo dependencias de producción: las de desarrollo no llegan al usuario.
      - run: npm audit --omit=dev --audit-level=high

  pruebas:
    name: Pruebas unitarias y de componentes
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma versión mayor que Neon en producción.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_PRUEBAS: postgres://postgres:postgres@localhost:5432/pruebas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:cobertura
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  e2e:
    name: Build y pruebas e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # El build aplica las migraciones sobre DATABASE_URL; el servidor e2e usa DATABASE_URL_PRUEBAS.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/e2e
      DATABASE_URL_PRUEBAS: postgres://postgres:postgres@localhost:5432/e2e
      ADMIN_CLAVE: clave-e2e
      SESION_SECRETO: secreto-e2e-solo-para-ci-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
      # Lighthouse en perfil móvil con red lenta simulada, contra el build de producción.
      - name: Lighthouse
        env:
          LLM_PROVEEDOR: falso
        run: |
          export CHROME_PATH="$(node -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")"
          npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-lighthouse
          path: .lighthouseci/
          retention-days: 7
