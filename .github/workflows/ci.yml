name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (lint, tipos, código muerto, duplicados, capas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run duplicados
      - run: npm run dependencias
      # Solo dependencias de producción: las de desarrollo no llegan al usuario.
      - run: npm audit --omit=dev --audit-level=high

  pruebas:
    name: Pruebas unitarias y de componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:cobertura
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  e2e:
    name: Build y pruebas e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
