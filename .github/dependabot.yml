version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The types follow the Node version the app runs on (24, see .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must always have the same version.
      react:
        patterns: ["react", "react-dom"]
      # vitest and its plugins (coverage) must always have the same version.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
